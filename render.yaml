# Render Blueprint — free tier
# Dashboard: New → Blueprint → chọn repo này

services:
  - type: web
    name: hoctiengtrung-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hoctiengtrung-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: WEB_APP_URL
        sync: false

databases:
  - name: hoctiengtrung-db
    plan: free
    databaseName: hoctiengtrung
    user: hoctiengtrung
